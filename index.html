<!DOCTYPE html>
<html class="light" lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>ClearTO — D-ATIS & D-Clearance SCEL</title>
  <meta name="theme-color" content="#0b2b5c"/>
  <link rel="manifest" href="manifest.webmanifest"/>
  <link rel="apple-touch-icon" href="icons/icon-192.png"/>
  <link rel="icon" href="icons/icon-192.png"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="ClearTO"/>

  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin href="https://fonts.gstatic.com" rel="preconnect"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"/>

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: { extend: {
        colors: {
          surface: "#f4f7fb",
          "surface-container": "#ffffff",
          "surface-container-low": "#f8fafc",
          "surface-container-high": "#eef2f7",
          "on-surface": "#0b2b5c",
          "on-surface-variant": "#64748b",
          primary: "#059669",
          "primary-dark": "#047857",
          secondary: "#0284c7",
          navy: "#0b2b5c",
          "navy-muted": "#1e3a68",
          outline: "#e2e8f0"
        },
        borderRadius: { DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px" },
        fontFamily: {
          headline: ["Public Sans", "sans-serif"],
          body: ["Public Sans", "sans-serif"],
          mono: ["JetBrains Mono", "monospace"]
        }
      } }
    };
  </script>
  <style>
    @layer base { html, body { width: 100vw; margin: 0; padding: 0; background-color: #f4f7fb; } }
    body { overscroll-behavior: none; font-family: "Public Sans", sans-serif; }
    .font-mono { font-family: "JetBrains Mono", monospace; }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
    .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
    ::-webkit-scrollbar { display: none; }
    input:focus { outline: none; box-shadow: none; }
  </style>
</head>
<body class="bg-surface font-body text-navy antialiased selection:bg-primary selection:text-white">
  <div id="app"></div>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
