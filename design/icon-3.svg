<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12467f"/>
      <stop offset="1" stop-color="#0a2b57"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="114" fill="url(#bg3)"/>
  <!-- dashed route -->
  <path d="M120 392 Q150 250 300 200 T400 130" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" stroke-dasharray="4 26"/>
  <path d="M120 392 Q150 250 300 200 T400 130" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="26" stroke-linecap="round"/>
  <!-- origin -->
  <circle cx="120" cy="392" r="26" fill="#0a2b57" stroke="#38bdf8" stroke-width="10"/>
  <circle cx="120" cy="392" r="8" fill="#eaf2ff"/>
  <!-- waypoint diamond -->
  <g transform="translate(226 268) rotate(45)">
    <rect x="-14" y="-14" width="28" height="28" fill="#0a2b57" stroke="#eaf2ff" stroke-width="7"/>
  </g>
  <!-- aircraft -->
  <g transform="translate(300 200) rotate(48)">
    <path d="M0 -40 L10 8 L40 28 L40 40 L10 30 L7 56 L20 66 L20 76 L0 68 L-20 76 L-20 66 L-7 56 L-10 30 L-40 40 L-40 28 L-10 8 Z" fill="#eaf2ff"/>
  </g>
  <!-- check destination -->
  <g transform="translate(400 130)">
    <circle r="54" fill="#10b981" stroke="#fff" stroke-width="9"/>
    <path d="M-23 2 L-7 20 L25 -18" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
